# Builds the runtime image for simulations: R 4.5 with this package installed
# at the pushed commit, published to GHCR under this repository's name.
#
# Tags:
#   :sha-<full commit>    the commit that was built
#
# Pin by digest, not by tag: the job summary prints the digest-pinned URI to
# record in the project that runs the simulations. The package inherits this
# repository's visibility.

name: Container

on:
  push:
    branches: ["scripthut/**"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Tracked files only: no .git, no untracked scratch.
      - name: Stage the package source
        run: |
          mkdir -p ctx/bayesm.HART
          git archive HEAD | tar -x -C ctx/bayesm.HART
          rm -rf ctx/bayesm.HART/.github ctx/bayesm.HART/docs ctx/bayesm.HART/pkgdown
          cp .github/container/Dockerfile ctx/Dockerfile

      # GHCR image names are lower case.
      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ctx
          file: ctx/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            HART_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin this build
        run: |
          uri="${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"
          {
            echo "## Pin this build"
            echo
            echo "bayesm.HART \`${{ github.sha }}\`"
            echo
            echo '```'
            echo "$uri"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$uri"
